{% if files %}<section class="card"><div class="card__head"><h2 class="card__title">Verification evidence</h2></div>{% for file in files %}<div class="dl__row"><div class="dl__meta"><span class="dl__name">{{ file.name }}</span><span class="dl__sub">{{ file.length }} bytes · sha256 <span class="mono">{{ file.digest }}</span></span></div><a class="btn btn--secondary btn--sm" href="/artifacts/{{ file.id }}">Download</a></div>{% endfor %}<p class="card__note">Immutable evidence files, served as attachments.</p></section>{% endif %}
