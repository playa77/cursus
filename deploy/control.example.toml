# Public provisioning template; not a measured deployment or runnable M0 service.
# Config loading/validation starts in WP-04. Replace every REPLACE_* locally.
schema_version = 1
process_kind = "control"

[service]
user = "cursus-control"
group = "cursus-control"
operator_group = "cursus-operators"
listen_host = "127.0.0.1"
listen_port = 8787
operator_socket = "/run/cursus/operator.sock"
external_origin = "https://REPLACE_VPS_B.REPLACE_TAILNET.ts.net"
operator_login = "REPLACE_EXACT_TAILSCALE_LOGIN"
# Only this service reads the DSN; never place the DSN itself in TOML.
dsn_file = "/etc/cursus/control/database-dsn"
artifact_root = "/var/lib/cursus-control/artifacts"
roles_file = "/opt/cursus/release/roles.toml"
prompts_root = "/opt/cursus/release/prompts"
# Future startup must reject a dirty or mismatched role/prompt release.
role_release_commit = "REPLACE_FULL_RELEASE_COMMIT"

[runner]
id = "REPLACE_RUNNER_UUID"
tailnet_node = "REPLACE_VPS_A_TAILNET_NODE"
# Digest file on VPS-B; bearer bytes live only on VPS-A.
bearer_digest_file = "/etc/cursus/control/runner-bearer.sha256"

[backup]
root = "/var/backups/cursus"
off_host_destination = "REPLACE_OPERATOR_MANAGED_BACKUP_DESTINATION"
# No scheduling or maintenance commands exist until WP-19.

[limits]
long_poll_seconds = 30
heartbeat_seconds = 10
unreachable_after_missed_heartbeats = 3
repair_retries = 2
interrupted_retries = 2
debate_rounds = 3
debug_turns = 10
interview_rounds = 20
request_bytes = 1048576
spec_bytes = 262144
log_event_bytes = 65536
events_per_batch = 100
artifact_bytes = 33554432
phase_artifact_bytes = 268435456
runner_spool_bytes = 2147483648

# Enrollment is data, never inferred from a worker response. Replace this whole
# example with an operator-approved repo and literal verification argv in WP-04.
[[repositories]]
owner = "REPLACE_GITHUB_OWNER"
name = "REPLACE_TRUSTED_REPO"
object_format = "sha1"
allowed_target_refs = ["refs/heads/main"]
phase_check_ids = ["unit"]

[[repositories.checks]]
id = "unit"
argv = ["/opt/cursus/venv/bin/python", "-m", "unittest", "discover", "-s", "tests/unit"]
cwd = "."
timeout_seconds = 300

# Required operator choices: no deployment defaults or shared frontier bottleneck.
[capacity]
worker = "REPLACE_1_TO_4"
claude = "REPLACE_1_OR_2"
codex = "REPLACE_1_OR_2"
agy = "REPLACE_1_OR_2"
pi = 1
verifier = 1
repository = 1
