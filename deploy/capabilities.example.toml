# WP-07 consumption contract:
# profile_digest in roles.toml is SHA-256 of these exact qualified bytes.
# fixed_argv is the complete literal installed-version invocation including
# model/provider/reasoning/tool flags. clean_config_argv disables discovered
# project extensions; organization roles also require read_only_argv.
# prompt_transport: stdin, argument (one appended prompt), or rpc (pi only).
# Production pi RPC emits correlated response, message_end assistant text and
# agent_end; Codex emits item.completed agent_message and turn.completed;
# Claude/agy emit result subtype=success. Any different installed wire format
# requires a parser change and requalification, never a guessed success flag.
# WP-09 activation gate: all four CLIs, both operator clients, OS/systemd
# boundaries and the real PR trace require private observed evidence. This
# public file remains unqualified; setting a string cannot establish proof.
# Optional role-specific measured overrides use [pi.role_profiles.scout] or
# [pi.role_profiles.reviewer]; override the full fixed_argv, tool_allowlist,
# qualified_roles where applicable. Read-only roles require
# read_only_argv and clean_config_argv; never inherit worker write tools.

# Qualification binds the image ID, native refresh semantics, independent auth
# domains and credential_concurrency at the operator-requested ceiling. No copying.
