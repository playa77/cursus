# Worksheet: explicit choices required; no agent concurrency defaults.
schema_version = 2
process_kind = "runner"
[service]
user = "cursus-runner"
origin = "https://REPLACE_VPS_B.REPLACE_TAILNET.ts.net"
runner_id = "REPLACE_RUNNER_UUID"
bearer_file = "/etc/cursus/runner/bearer"
state_root = "/var/lib/cursus-runner/state"
spool_root = "/var/lib/cursus-runner/spool"
repository_root = "/var/lib/cursus-runner/repositories"
worktree_root = "/var/lib/cursus-runner/worktrees"
review_root = "/var/lib/cursus-runner/reviews"
capabilities_file = "/etc/cursus/runner/capabilities.toml"
capabilities_digest = "REPLACE_SHA256_OF_QUALIFIED_PROFILE"
[publisher]
git_binary = "/usr/bin/git"
git_credential_file = "/etc/cursus/runner/publisher-git-credential"
github_credential_file = "/etc/cursus/runner/publisher-github-credential"
[capacity]
worker = "REPLACE_WORKER_1_TO_4"
claude = "REPLACE_CLAUDE_1_TO_2"
codex = "REPLACE_CODEX_1_TO_2"
agy = "REPLACE_AGY_1_TO_2"
verifier = 1
repository = 1
[limits]
long_poll_seconds = 30
heartbeat_seconds = 10
spool_bytes = 2147483648
[containers]
binary = "/usr/bin/podman"
version = "REPLACE_EXACT_5_X_VERSION"
image = "REPLACE_LOCAL_QUALIFIED_IMAGE_SHA256_ID"
network = "private"
disk_reserve_mb = "REPLACE_POLICY_MB"
[containers.budget]
memory_mb = "REPLACE_EXECUTION_MB"
cpu_millis = "REPLACE_EXECUTION_CPU_MILLIS"
pids = "REPLACE_EXECUTION_TASK_LIMIT"
host_reserve_mb = "REPLACE_HOST_RESERVE_MB"
host_reserve_cpu_millis = "REPLACE_HOST_RESERVE_CPU_MILLIS"
[containers.resources.agent]
memory_mb = "REPLACE_POLICY_MB"
cpu_millis = "REPLACE_POLICY_CPU_MILLIS"
pids = "REPLACE_POLICY_TASK_LIMIT"
tmp_mb = "REPLACE_TMPFS_MB"
home_mb = "REPLACE_HOME_TMPFS_MB"
[containers.resources.verifier]
memory_mb = "REPLACE_POLICY_MB"
cpu_millis = "REPLACE_POLICY_CPU_MILLIS"
pids = "REPLACE_POLICY_TASK_LIMIT"
tmp_mb = "REPLACE_TMPFS_MB"
home_mb = "REPLACE_HOME_TMPFS_MB"
# Declare one independent domain per configured concurrent session, for each CLI.
# Mount only a provider's explicitly qualified auth directory, never a whole HOME.
# No native credential path is guessed here. Renewal writes persist in place.
[[containers.credentials.pi]]
id = "pi-1"
evidence = "REPLACE_PRIVATE_CONCURRENCY_AND_REFRESH_ATTESTATION"
mounts = [{source = "/REPLACE_AUTH_DOMAIN_PI_1", target = "/home/session/REPLACE_NATIVE_AUTH_SUBDIRECTORY"}]
[[containers.credentials.claude]]
id = "claude-1"
evidence = "REPLACE_PRIVATE_CONCURRENCY_AND_REFRESH_ATTESTATION"
mounts = [{source = "/REPLACE_AUTH_DOMAIN_CLAUDE_1", target = "/home/session/REPLACE_NATIVE_AUTH_SUBDIRECTORY"}]
[[containers.credentials.codex]]
id = "codex-1"
evidence = "REPLACE_PRIVATE_CONCURRENCY_AND_REFRESH_ATTESTATION"
mounts = [{source = "/REPLACE_AUTH_DOMAIN_CODEX_1", target = "/home/session/REPLACE_NATIVE_AUTH_SUBDIRECTORY"}]
[[containers.credentials.agy]]
id = "agy-1"
evidence = "REPLACE_PRIVATE_CONCURRENCY_AND_REFRESH_ATTESTATION"
mounts = [{source = "/REPLACE_AUTH_DOMAIN_AGY_1", target = "/home/session/REPLACE_NATIVE_AUTH_SUBDIRECTORY"}]
[[repositories]]
owner = "REPLACE_GITHUB_OWNER"
name = "REPLACE_TRUSTED_REPO"
object_format = "sha1"
allowed_target_refs = ["refs/heads/main"]
phase_check_ids = ["unit"]
[[repositories.checks]]
id = "unit"
# Absolute binary path INSIDE the qualified image, not the runner host.
argv = ["/usr/bin/python3", "-m", "unittest", "discover", "-s", "tests/unit"]
cwd = "."
timeout_seconds = 300
