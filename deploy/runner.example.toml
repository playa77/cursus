home = "/var/lib/cursus-identities/exec-16"

[verification]
user = "cursus-verifier"
home = "/var/lib/cursus-identities/verifier"

# A distinct pi reviewer is optional; if enabled, it needs its own native login
# and read-only qualification. Default reviewer remains the Codex identity.
[pi_reviewer]
enabled = false
user = "cursus-pi-reviewer"
home = "/var/lib/cursus-identities/pi-reviewer"

# Mirror the exact approved enrollment from VPS-B.
[[repositories]]
owner = "REPLACE_GITHUB_OWNER"
name = "REPLACE_TRUSTED_REPO"
object_format = "sha1"
allowed_target_refs = ["refs/heads/main"]
phase_check_ids = ["unit"]

[[repositories.checks]]
id = "unit"
argv = ["/opt/cursus/venv/bin/python", "-m", "unittest", "discover", "-s", "tests/unit"]
cwd = "."
timeout_seconds = 300

# Explicit safety budgets, not measurements of vendor CLI consumption.
[resources]
reserve_memory_bytes = 2147483648
reserve_disk_bytes = 2147483648
worker_memory_bytes = 2147483648
frontier_memory_bytes = 536870912
verifier_memory_bytes = 2147483648
cpu_percent = 100
tasks_max = 128
repository_bytes = 1073741824

# Required operator choices: no deployment defaults or shared frontier bottleneck.
[capacity]
worker = "REPLACE_1_TO_4"
claude = "REPLACE_1_OR_2"
codex = "REPLACE_1_OR_2"
agy = "REPLACE_1_OR_2"
pi = 1
verifier = 1
repository = 1
