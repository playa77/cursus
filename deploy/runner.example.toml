# Public provisioning template. M0 does not start a runner or CLI subprocess.
schema_version = 1
process_kind = "runner"

[service]
# Trusted parent needs UID/GID switching; no repo code runs as this identity.
user = "root"
origin = "https://REPLACE_VPS_B.REPLACE_TAILNET.ts.net"
runner_id = "REPLACE_RUNNER_UUID"
bearer_file = "/etc/cursus/runner/bearer"
state_root = "/var/lib/cursus-runner/state"
spool_root = "/var/lib/cursus-runner/spool"
repository_root = "/var/lib/cursus-runner/repositories"
worktree_root = "/var/lib/cursus-runner/worktrees"
review_root = "/var/lib/cursus-runner/reviews"
capabilities_file = "/etc/cursus/runner/capabilities.toml"
capabilities_digest = "REPLACE_SHA256_OF_QUALIFIED_PROFILE"
# No DSN or PostgreSQL client belongs on the runner.

[publisher]
git_binary = "/usr/bin/git"
git_credential_file = "/etc/cursus/runner/publisher-git-credential"
github_credential_file = "/etc/cursus/runner/publisher-github-credential"
# Provision these via an operator-approved opaque client; never copy credentials
# from a developer agent, CLI home, prompt or repository.

[limits]
long_poll_seconds = 30
heartbeat_seconds = 10
spool_bytes = 2147483648

# Binaries must be approved, absolute, version-pinned installations. The
# placeholder paths below are not assertions about any vendor's install layout.
[cli.pi]
# Relative regular files explicitly selected after native login; never whole homes.
auth_files = []
binary = "/opt/cursus-cli/REPLACE_PI_VERSION/bin/pi"
user = "cursus-pi"
home = "/var/lib/cursus-identities/pi"
provider = "REPLACE_QUALIFIED_OPENCODE_GO_PROVIDER_ID"
model = "deepseek-v4.1-flash"
reasoning = "REPLACE_QUALIFIED_REASONING_VALUE"

[cli.claude]
# Relative regular files explicitly selected after native login; never whole homes.
auth_files = []
binary = "/opt/cursus-cli/REPLACE_CLAUDE_VERSION/bin/claude"
user = "cursus-claude"
home = "/var/lib/cursus-identities/claude"
model = "REPLACE_QUALIFIED_CLAUDE_MODEL"

[cli.codex]
# Relative regular files explicitly selected after native login; never whole homes.
auth_files = []
binary = "/opt/cursus-cli/REPLACE_CODEX_VERSION/bin/codex"
user = "cursus-codex"
home = "/var/lib/cursus-identities/codex"
model = "REPLACE_QUALIFIED_CODEX_MODEL"

[cli.agy]
# Relative regular files explicitly selected after native login; never whole homes.
auth_files = []
binary = "/opt/cursus-cli/REPLACE_AGY_VERSION/bin/agy"
user = "cursus-agy"
home = "/var/lib/cursus-identities/agy"
model = "REPLACE_QUALIFIED_AGY_MODEL"

[[execution_pool]]
id = "exec-01"
user = "cursus-exec-01"
home = "/var/lib/cursus-identities/exec-01"

[[execution_pool]]
id = "exec-02"
user = "cursus-exec-02"
home = "/var/lib/cursus-identities/exec-02"

[[execution_pool]]
id = "exec-03"
user = "cursus-exec-03"
home = "/var/lib/cursus-identities/exec-03"

[[execution_pool]]
id = "exec-04"
user = "cursus-exec-04"
home = "/var/lib/cursus-identities/exec-04"

[[execution_pool]]
id = "exec-05"
user = "cursus-exec-05"
home = "/var/lib/cursus-identities/exec-05"

[[execution_pool]]
id = "exec-06"
user = "cursus-exec-06"
home = "/var/lib/cursus-identities/exec-06"

[[execution_pool]]
id = "exec-07"
user = "cursus-exec-07"
home = "/var/lib/cursus-identities/exec-07"

[[execution_pool]]
id = "exec-08"
user = "cursus-exec-08"
home = "/var/lib/cursus-identities/exec-08"

[[execution_pool]]
id = "exec-09"
user = "cursus-exec-09"
home = "/var/lib/cursus-identities/exec-09"

[[execution_pool]]
id = "exec-10"
user = "cursus-exec-10"
home = "/var/lib/cursus-identities/exec-10"

[[execution_pool]]
id = "exec-11"
user = "cursus-exec-11"
